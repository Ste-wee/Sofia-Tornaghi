backend:
  name: git-gateway
  branch: main

media_folder: "images"
public_folder: "/images"

locale: "it"

# NOTA TECNICA: tutti i testi del sito vivono in un solo file
# (content/site.json), organizzato qui sotto in sezioni con il widget
# "object" solo per comodità di lettura nel pannello — sono raggruppamenti
# visivi, il salvataggio riguarda sempre l'intero file in un colpo solo.
# Ad ogni pubblicazione, build.js legge questo file e genera index.html:
# non serve toccare l'HTML per aggiungere o togliere una voce da una lista.
collections:
  - name: "contenuti"
    label: "Contenuti del sito"
    files:
      - name: "testi"
        label: "Testi del sito"
        file: "content/site.json"
        fields:

          - label: "Generale"
            name: "generale"
            widget: "object"
            fields:
              - label: "Nome mostrato (intestazione, menu, footer)"
                name: "nav_brand"
                widget: "string"
              - label: "Link 'Prenota online' (MioDottore)"
                name: "link_prenotazione"
                widget: "string"
                hint: "Usato in tutti i pulsanti di prenotazione del sito: cambialo qui una sola volta."

          - label: "Home"
            name: "home"
            widget: "object"
            fields:
              - label: "Sottotitolo sotto il nome"
                name: "hero_sub"
                widget: "text"
              - label: "Testo pulsante principale"
                name: "hero_cta_primario"
                widget: "string"
              - label: "Testo pulsante secondario"
                name: "hero_cta_secondario"
                widget: "string"
              - label: "Didascalia sotto la citazione"
                name: "hero_meta"
                widget: "string"
              - label: "Statistica 1 — numero (es. 16+)"
                name: "stat1_num"
                widget: "string"
              - label: "Statistica 1 — etichetta"
                name: "stat1_label"
                widget: "string"
              - label: "Statistica 2 — etichetta"
                name: "stat2_label"
                widget: "string"
                hint: "Il numero mostrato sopra è sempre il prezzo del primo servizio in tariffario."
              - label: "Statistica 3 — numero (es. In studio)"
                name: "stat3_num"
                widget: "string"
              - label: "Statistica 4 — numero (es. Online)"
                name: "stat4_num"
                widget: "string"
              - label: "Statistica 4 — etichetta"
                name: "stat4_label"
                widget: "string"

          - label: "Chi sono"
            name: "chiSono"
            widget: "object"
            fields:
              - label: "Occhiello sezione"
                name: "eyebrow"
                widget: "string"
              - label: "Titolo sezione"
                name: "titolo"
                widget: "string"
                hint: "Un 'a capo' nel testo crea una riga nuova nel titolo."
              - label: "Primo paragrafo"
                name: "bio_p1"
                widget: "text"
              - label: "Secondo paragrafo"
                name: "bio_p2"
                widget: "text"
                hint: "Questo testo compare anche come citazione nella home."
              - label: "Terzo paragrafo"
                name: "bio_p3"
                widget: "text"
              - label: "Box 'Approccio terapeutico' — etichetta"
                name: "approach_label"
                widget: "string"
              - label: "Box 'Approccio terapeutico' — valore"
                name: "approach_value"
                widget: "string"
              - label: "Formazione e credenziali"
                name: "credenziali"
                widget: "list"
                summary: "{{label}}"
                fields:
                  - label: "Icona"
                    name: "icona"
                    widget: "select"
                    options: &icone
                      - { label: "Laurea (tocco)", value: "laurea" }
                      - { label: "Libro", value: "libro" }
                      - { label: "Cuore", value: "cuore" }
                      - { label: "Edificio / struttura", value: "edificio" }
                      - { label: "Percorso / crescita", value: "crescita" }
                      - { label: "Gruppo / famiglia", value: "gruppo" }
                      - { label: "Bussola / orientamento", value: "bussola" }
                      - { label: "Persona", value: "persona" }
                      - { label: "Dialogo / relazione", value: "dialogo" }
                  - label: "Etichetta (es. Formazione)"
                    name: "label"
                    widget: "string"
                  - label: "Descrizione"
                    name: "value"
                    widget: "text"

          - label: "Aree di lavoro"
            name: "aree"
            widget: "object"
            fields:
              - label: "Occhiello sezione"
                name: "eyebrow"
                widget: "string"
              - label: "Titolo sezione"
                name: "titolo"
                widget: "string"
              - label: "Testo introduttivo"
                name: "intro"
                widget: "text"
              - label: "Aree"
                name: "lista"
                widget: "list"
                summary: "{{titolo}}"
                fields:
                  - { label: "Icona", name: "icona", widget: "select", options: *icone }
                  - label: "Titolo area"
                    name: "titolo"
                    widget: "string"
                  - label: "Descrizione"
                    name: "desc"
                    widget: "text"

          - label: "Recensioni"
            name: "recensioni"
            widget: "object"
            fields:
              - label: "Occhiello sezione"
                name: "eyebrow"
                widget: "string"
              - label: "Titolo sezione"
                name: "titolo"
                widget: "string"
              - label: "Testo del link a MioDottore"
                name: "cta"
                widget: "string"
              - label: "Recensioni"
                name: "lista"
                widget: "list"
                summary: "{{autore}}"
                fields:
                  - label: "Testo recensione"
                    name: "testo"
                    widget: "text"
                  - label: "Autore"
                    name: "autore"
                    widget: "string"

          - label: "Servizi e tariffe"
            name: "servizi"
            widget: "object"
            fields:
              - label: "Occhiello sezione"
                name: "eyebrow"
                widget: "string"
              - label: "Titolo sezione"
                name: "titolo"
                widget: "string"
              - label: "Testo introduttivo"
                name: "intro"
                widget: "text"
              - label: "Servizi"
                name: "lista"
                widget: "list"
                summary: "{{nome}} — {{prezzo}}"
                hint: "Il primo servizio della lista è anche quello mostrato come prezzo in evidenza nella home."
                fields:
                  - label: "Nome del servizio"
                    name: "nome"
                    widget: "string"
                  - label: "Prezzo (es. 60 €)"
                    name: "prezzo"
                    widget: "string"

          - label: "Contatti"
            name: "contatti"
            widget: "object"
            fields:
              - label: "Occhiello sezione"
                name: "eyebrow"
                widget: "string"
              - label: "Titolo sezione"
                name: "titolo"
                widget: "string"
              - label: "Testo introduttivo"
                name: "intro"
                widget: "text"
              - label: "Indirizzo studio"
                name: "indirizzo"
                widget: "string"
                hint: "Genera anche il link alla mappa: scrivilo per esteso, es. \"Viale Gran Sasso 10, Milano 20131\"."
              - label: "Telefono"
                name: "telefono"
                widget: "string"
                hint: "Genera anche il link per chiamare da cellulare."
              - label: "Testo consulenze online"
                name: "consulenzeOnlineTesto"
                widget: "string"
              - label: "Metodi di pagamento"
                name: "metodiPagamento"
                widget: "string"
                hint: "Separa i metodi con · (es. Contanti · Bonifico · Carta)."

          - label: "Modulo di contatto"
            name: "form"
            widget: "object"
            fields:
              - label: "Titolo del modulo"
                name: "titolo"
                widget: "string"
              - label: "Nota sotto il titolo"
                name: "nota"
                widget: "text"
              - label: "Nota privacy sotto il pulsante Invia"
                name: "privacy"
                widget: "text"
              - label: "Testo separatore (es. 'oppure')"
                name: "alt"
                widget: "string"
              - label: "Testo pulsante MioDottore"
                name: "ctaSecondaria"
                widget: "string"

          - label: "Footer"
            name: "footer"
            widget: "object"
            fields:
              - label: "Riga sotto il nome"
                name: "nota"
                widget: "string"

      - name: "foto"
        label: "Foto profilo"
        file: "content/foto.json"
        fields:
          - label: "Foto profilo"
            name: "immagine"
            widget: "image"
            hint: "Carica una foto quadrata (verrà mostrata in cima al sito). Meglio se leggera e di forma quadrata."
